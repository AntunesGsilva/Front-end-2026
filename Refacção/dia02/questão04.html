<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Jogador - Questão 04</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .player-card { border-radius: 20px; border: 3px solid #007bff; transition: all 0.3s ease; margin-bottom: 20px; }
        .player-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,123,255,0.3); }
        .player-image { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-add { background: linear-gradient(45deg, #28a745, #20c997); border: none; border-radius: 25px; padding: 12px 30px; font-weight: bold; font-size: 1.1em; }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(40,167,69,0.4); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="text-center mb-5 text-primary">⚽ Time dos Sonhos</h1>
                <div class="card player-card mx-auto" style="max-width: 500px;">
                    <div class="card-body text-center p-4">
                        <img src="vinicius_junior.png" alt="Jogador" class="player-image mx-auto mb-3">
                        <h3 class="card-title mb-3" id="nomeOriginal">Vinicius Junior</h3>
                        <p class="card-text mb-1" id="nascimentoOriginal"><strong>📅 Data de Nascimento:</strong> 01/01/2000 (25 anos)</p>
                        <p class="card-text mb-1" id="alturaOriginal"><strong>📏 Altura:</strong> 1,85 m</p>
                        <p class="card-text mb-2" id="posicaoOriginal"><strong>🏃 Posição:</strong> Atacante</p>
                        <p class="card-text mb-0" id="rankOriginal"><strong>⭐ Rank:</strong> <span class="text-warning">9.2</span></p>
                    </div>
                </div>
                <div class="text-center">
                    <button class="btn btn-success btn-add btn-lg" onclick="add()">Adicionar Novo Jogador</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
